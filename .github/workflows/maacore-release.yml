name: Release MaaCore SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Assistant.cpp', 'Assistant.h', 'AsstCaller.cpp', 'AsstCallerExtra.cpp', 'InstHelper.cpp', 'InstHelper.h', 'Status.cpp', 'Status.h', 'Common/**', 'Config/**', 'Controller/**', 'Task/**', 'Ui/**', 'Utils/**', 'Vision/**', 'include/**', 'MaaUtils/**', 'cmake/**', 'tools/fastdeploy-manifest.json', '.github/workflows/maacore-release.yml') }}
          restore-keys: |
            sccache-release-${{ runner.os }}-

      - name: Cache prebuilt dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: maacore-deps-${{ runner.os }}-${{ hashFiles('tools/fastdeploy-manifest.json', 'tools/deps-versions.json', 'tools/build-upstream-deps.ps1', 'tools/fetch-deps.ps1', 'cmake/**') }}
          restore-keys: |
            maacore-deps-${{ runner.os }}-

      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: .bootstrap/upstream-deps
          key: upstream-deps-downloads-${{ runner.os }}-${{ hashFiles('tools/build-upstream-deps.ps1', 'tools/deps-versions.json') }}
          restore-keys: |
            upstream-deps-downloads-${{ runner.os }}-

      - name: Bootstrap standalone prerequisites
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-standalone.ps1

      - name: Build MaaCore
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          sccache --zero-stats
          powershell -ExecutionPolicy Bypass -File .\tools\build-maacore-only.ps1 `
            -SkipBootstrap -NoFresh -UseSccache -Config RelWithDebInfo `
            -Generator "Ninja Multi-Config" -Parallel ([Environment]::ProcessorCount) `
            -Version "$version"

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Package SDK
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          powershell -ExecutionPolicy Bypass -File .\tools\package-sdk.ps1 -Version $version -Config RelWithDebInfo

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaCore-sdk-windows-x64
          path: dist/MaaCore-sdk-*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: MaaCore SDK ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: dist/MaaCore-sdk-*
          generate_release_notes: true
