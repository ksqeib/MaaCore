name: Release MaaCore SDK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      include_cuda:
        description: Include onnxruntime_providers_cuda.dll (~170 MB)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'Assistant.cpp', 'Assistant.h', 'AsstCaller.cpp', 'AsstCallerExtra.cpp', 'InstHelper.cpp', 'InstHelper.h', 'Status.cpp', 'Status.h', 'Common/**', 'Config/**', 'Controller/**', 'Task/**', 'Ui/**', 'Utils/**', 'Vision/**', 'include/**', 'MaaUtils/**', 'cmake/**', 'tools/deps-manifest.json', '.github/workflows/maacore-release.yml') }}
          restore-keys: |
            sccache-release-${{ runner.os }}-

      - name: Cache prebuilt dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: maacore-deps-${{ runner.os }}-${{ hashFiles('tools/deps-manifest.json') }}
          restore-keys: |
            maacore-deps-${{ runner.os }}-

      - name: Bootstrap standalone prerequisites
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-standalone.ps1

      - name: Build MaaCore
        shell: pwsh
        run: |
          sccache --zero-stats
          powershell -ExecutionPolicy Bypass -File .\tools\build-maacore-only.ps1 `
            -SkipBootstrap -NoFresh -UseSccache -Config RelWithDebInfo `
            -Generator "Ninja Multi-Config" -Parallel ([Environment]::ProcessorCount)

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Package SDK
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $packageArgs = @("-Version", $version, "-Config", "RelWithDebInfo")
          if ("${{ inputs.include_cuda }}" -eq "true") {
            $packageArgs += "-IncludeCuda"
          }
          powershell -ExecutionPolicy Bypass -File .\tools\package-sdk.ps1 @packageArgs

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaCore-sdk-windows-x64
          path: dist/MaaCore-sdk-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: MaaCore SDK ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: dist/MaaCore-sdk-*.zip
          generate_release_notes: true
